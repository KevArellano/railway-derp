<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>railway-derp</title>
    <style>
        :root {
            color-scheme: light dark;
            --fg: #1a1a1a;
            --bg: #fafafa;
            --muted: #6b7280;
            --accent: #6366f1;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e5e7eb;
                --bg: #0f0f11;
                --muted: #9ca3af;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--fg);
            background: var(--bg);
        }
        main {
            text-align: center;
            padding: 2rem;
            max-width: 32rem;
        }
        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin: 0 0 0.5rem;
            letter-spacing: -0.02em;
        }
        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
        }
        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }
    </style>
</head>
<body>
    <main>
        <h1>railway-derp</h1>
        <p>A minimal Rust + Axum service, running on Railway.</p>
        <span class="badge">it works</span>
    </main>
</body>
</html>
