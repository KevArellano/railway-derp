<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>railway-derp</title>
    <style>
        :root {
            color-scheme: light dark;
            --fg: #1a1a1a;
            --bg: #fafafa;
            --muted: #6b7280;
            --accent: #6366f1;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e5e7eb;
                --bg: #0f0f11;
                --muted: #9ca3af;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--fg);
            background: var(--bg);
        }
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.9rem;
            padding: 0.85rem 1.25rem;
            font-size: 0.9rem;
        }
        header .email { color: var(--muted); }
        header a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        header form { margin: 0; }
        header button {
            border: 1px solid var(--border, #d1d5db);
            background: transparent;
            color: var(--fg);
            border-radius: 0.5rem;
            padding: 0.35rem 0.7rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        main {
            flex: 1;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 2rem;
        }
        main > div { max-width: 32rem; }
        h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin: 0 0 0.5rem;
            letter-spacing: -0.02em;
        }
        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
        }
        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
        }
    </style>
</head>
<body>
    <header><!--HEADER--></header>
    <main>
        <div>
            <h1>railway-derp</h1>
            <p>A minimal Rust + Axum service, running on Railway.</p>
            <span class="badge">it works</span>
        </div>
    </main>
</body>
</html>
